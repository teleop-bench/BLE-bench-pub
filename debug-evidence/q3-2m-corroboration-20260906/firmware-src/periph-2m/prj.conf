CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_DEVICE_NAME="q2periph"
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_CTLR_TX_PWR_MINUS_20=y
# Q2 is 1M-only: disable 2M support + auto-PHY-update so the connection stays 1M
# (the observer decodes 1M). The controller default auto-upgrades to 2M.
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_AUTO_PHY_UPDATE=n
