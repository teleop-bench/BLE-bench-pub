# Throughput cells: DLE (auto via >27 buffers) + MTU 247 + blast mode.
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_APP_TPUT_BLAST=y
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=10
# Phase-A finding: without event extension the SDC drains ONE PDU per ~2.4 ms.
CONFIG_BT_CTLR_SDC_CONN_EVENT_EXTEND_DEFAULT=y
