CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="z54-lat-central"
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_LOG=y
# --- FSU 2M/50ms saturation preflight (downlink blast, FSU OFF) ---
CONFIG_APP_TPUT_BLAST=y
CONFIG_BT_BUF_ACL_TX_COUNT=64
CONFIG_APP_FSU_MIN_US=0
CONFIG_APP_FSU_MAX_US=0
CONFIG_BT_BUF_EVT_RX_COUNT=68
# --- MTU fix (reviewer): 247-byte writes, DLE ---
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

# event-fill experiment: FORCE_MD armed early
CONFIG_BT_CTLR_FORCE_MD_COUNT=10
CONFIG_APP_FORCE_MD_ARM_AT=4
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
