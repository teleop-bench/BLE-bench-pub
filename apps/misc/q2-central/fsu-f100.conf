CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_CTLR_EXTENDED_FEAT_SET=y
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
# CONN_INTERVAL_LOW_LATENCY + EVENT_IFS_LOW_LAT_US live in the "Advanced features"
# menu (`visible if BT_CTLR_ADVANCED_FEATURES`); without this they are SILENTLY
# dropped and the tIFS floor stays at 150.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
CONFIG_BT_CTLR_FSU_BENCH_FORCE_FEAT=y
CONFIG_BT_CTLR_EVENT_IFS_LOW_LAT_US=52
# non-spec in-event echo (carried by patch 0001) MUST be off for Q3.
CONFIG_BT_CTLR_INEVENT_ECHO=n
CONFIG_APP_FSU_MIN_US=100
CONFIG_APP_FSU_MAX_US=150
CONFIG_APP_Q3_MODE=y
