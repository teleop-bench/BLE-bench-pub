CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_DEVICE_NAME="q2central"
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048
# NOTE: TX power here is FSU-observer-specific, NOT a throughput/latency benchmark
# setting (the main bench apps use the Zephyr default). This central/periph pair is
# intentionally ASYMMETRIC (+8 / -20 dBm; tx-swap.conf reverses it) for the observer's
# near/far RSSI attribution. SYMMETRIC calibration instead needs the two endpoints
# BALANCED to <=6 dB at the observer -- rig-specific; see docs/LESSONS.md +
# debug-evidence/q3-2m-corroboration-20260906/firmware-src/calib-controls-2m/README.md.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Q2 is 1M-only: disable 2M support + auto-PHY-update so the connection stays 1M
# (the observer decodes 1M). The controller default auto-upgrades to 2M.
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_AUTO_PHY_UPDATE=n
