# Open-stack FSU responder (peripheral). Mirrors the proven z54-lat-periph/fsu-open.conf:
# CONN_INTERVAL_LOW_LATENCY is REQUIRED — it gates the low-lat tIFS options, without which
# the responder can't support 52us and FSU negotiation falls back to 150us (no gain).
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FSU_BENCH_FORCE_FEAT=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
CONFIG_BT_CTLR_EVENT_IFS_LOW_LAT_US=52
