# SDC duplex, FSU OFF (150us control). Ported from coc-central/sdc-fsu.conf + RX count (this node
# also RECEIVES the peripheral's uplink blast, so both TX and RX pools must be deep).
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_SDC_ENABLE_LOWEST_FRAME_SPACE=y
CONFIG_BT_CTLR_SDC_EXTENDED_FEAT_MAX_REMOTE_PAGE=1
CONFIG_APP_AUTO_FSU=y
CONFIG_APP_FSU_MIN_US=150
CONFIG_APP_FSU_MAX_US=150
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=20
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=20
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=50000
CONFIG_BT_CTLR_SDC_CONN_EVENT_EXTEND_DEFAULT=y
