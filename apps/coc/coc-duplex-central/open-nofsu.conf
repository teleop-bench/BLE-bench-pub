CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_CTLR_EXTENDED_FEAT_SET=y
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
CONFIG_BT_CTLR_FSU_BENCH_FORCE_FEAT=y
CONFIG_BT_CTLR_EVENT_IFS_LOW_LAT_US=52
CONFIG_BT_CTLR_INEVENT_ECHO=n
CONFIG_APP_AUTO_FSU=y
CONFIG_APP_FSU_MIN_US=150
CONFIG_APP_FSU_MAX_US=150
# Controller TX queue 20 deep (= SDC's 20 packets). The prj.conf 64 lets each side's L2CAP credit returns wait behind
# ~64 of its own queued packets: at 25 ms both sides periodically run dry (credit-loop starvation; debug-evidence/
# coc-duplex-25ms-diag-20261006). ATT_TX_COUNT follows ACL_TX_COUNT by default; pinned so only the queue changes.
CONFIG_BT_BUF_ACL_TX_COUNT=20
CONFIG_BT_ATT_TX_COUNT=64
