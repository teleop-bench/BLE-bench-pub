; ESP32 L2CAP CoC Echo Server
; Tests BLE L2CAP Connection-Oriented Channel transport.
; ESP32 acts as peripheral (server), Linux host as central (client).
;
; Build: pio run
; Flash: pio run --target upload
; Monitor: pio device monitor --baud 115200

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0

; Need central role disabled but L2CAP requires specific NimBLE configs
build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_L2CAP_COC_MAX_NUM=2
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=4
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=4
