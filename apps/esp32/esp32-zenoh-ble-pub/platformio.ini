[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; zenoh-pico as local library (PlatformIO resolves via library.json).
; Point ZENOH_PICO_DIR at your local zenoh-pico checkout, e.g.:
;   export ZENOH_PICO_DIR=/path/to/zenoh-pico
lib_deps =
    symlink://${sysenv.ZENOH_PICO_DIR}

; Pass BLE L2CAP feature flag through to zenoh-pico's CMake configure step
board_build.cmake_extra_args =
    -DZ_FEATURE_LINK_BLE_L2CAP=1

; Compiler flags for main.c and all libraries
; ZENOH_ESPIDF is normally set by extra_script.py but we ensure it here
build_flags =
    -DZENOH_ESPIDF
    -DZ_FEATURE_LINK_BLE_L2CAP=1
