; ESP32 NUS (Nordic UART Service) BLE Bridge
; Transparent UART <-> BLE bridge for zenoh-pico serial transport
;
; Build: pio run
; Flash: pio run --target upload
; Monitor: pio device monitor --baud 115200

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; NimBLE is lighter than the default ESP-IDF BLE stack
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0

; Use NimBLE instead of default Bluedroid
build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; ESP32-C3 variant (uncomment to use instead of ESP32)
; [env:esp32c3]
; platform = espressif32
; board = esp32-c3-devkitm-1
; framework = arduino
; monitor_speed = 115200
; lib_deps =
;     h2zero/NimBLE-Arduino@^2.1.0
