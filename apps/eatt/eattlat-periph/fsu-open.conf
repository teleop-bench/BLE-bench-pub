# M0 open-stack FSU bench fragment (see zephyr-patches/fsu-m0-cheatsheet.md)
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
# BENCH-ONLY shim: forces FSU feature known-supported (no real page exchange)
CONFIG_BT_CTLR_FSU_BENCH_FORCE_FEAT=y
# 52us floor for the FSU clamp (stock low-lat knob; interval stays 7.5ms)
# ADVANCED_FEATURES makes the low-lat options visible (menu 'visible if')
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
CONFIG_BT_CTLR_EVENT_IFS_LOW_LAT_US=52
