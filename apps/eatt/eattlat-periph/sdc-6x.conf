# Peripheral support for the SDC 6.x cells: accept FSU + SCI initiated by the central.
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_SUBRATING=y
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_SHORTER_CONNECTION_INTERVALS=y
# Legacy preferred-params auto-update would yank the interval back to 7.5 ms
# ~5 s after connect, overriding a negotiated SCI rate (observed). Off for 6.x cells.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
