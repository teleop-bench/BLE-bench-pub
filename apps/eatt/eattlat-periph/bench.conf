# §14.9 watchdog-bench overlay — NOT part of the default build.
# Keep bench and latency-baseline configurations separate (see central
# bench.conf: the HB stream shifts the ping RTT distribution). Build with:
#   west build -- -DEXTRA_CONF_FILE=bench.conf
CONFIG_APP_SAFETY_WATCHDOG=y
# §14.9 rev-4: the deadline runs on the on-chip hardware watchdog (wdt31);
# HWINFO provides the post-trip reset-cause evidence.
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
