; nRF52832 DK (PCA10040) — BLE 5 L2CAP CoC echo server (Zephyr)
;
; Peripheral counterpart to the Linux central in ../test-l2cap-echo.py.
; Unlike the classic-ESP32 build (Bluetooth 4.2, 1M PHY only), the nRF52
; is BLE 5 and this firmware turns on LE 2M PHY + Data Length Extension,
; so it can actually measure raw BLE 5 L2CAP throughput.
;
; Build:   pio run
; Flash:   copy .pio/build/nrf52_dk/firmware.hex onto the JLINK drive
;          (or: pio run -t upload / nRF Connect Programmer)
; Monitor: pio device monitor -b 115200   (J-Link VCOM = /dev/ttyACM0)

[env:nrf52_dk]
platform = nordicnrf52
board = nrf52_dk
framework = zephyr
monitor_speed = 115200
