# BLE 5 L2CAP CoC echo server for nRF52832 DK

# --- Bluetooth core, peripheral role ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="zenoh-nrf-l2cap"
CONFIG_BT_DEVICE_APPEARANCE=0

# Peripheral preferred connection params — default is 30-50 ms which AUTO-
# OVERRIDES a central's short interval. Pin to 7.5 ms so a fast central sticks.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- L2CAP connection-oriented channels (dynamic PSM) ---
# BT_L2CAP_DYNAMIC_CHANNEL depends on BT_SMP in Zephyr 2.7, so SMP must be on
# (we still use security level L1 in the server, so no pairing is required).
CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# L2CAP RX init credits default to (ACL_RX_COUNT - 1).
CONFIG_BT_BUF_ACL_RX_COUNT=10
# Controller RX buffers per connection event — default 1 caps packets/event
# (the real throughput limiter). Raise it so the DK receives many packets/event.
CONFIG_BT_CTLR_RX_BUFFERS=8
# TX contexts: exhausting these caused "Unable to allocate TX context"
CONFIG_BT_CONN_TX_MAX=10

# --- BLE 5 throughput knobs: 2M PHY + Data Length Extension ---
# USER_* variants let the app request them explicitly in connected() and
# get the le_phy_updated / le_data_len_updated callbacks for logging.
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# --- memory ---
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048

# --- console/logging over J-Link VCOM (UART0 -> /dev/ttyACM0) ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
