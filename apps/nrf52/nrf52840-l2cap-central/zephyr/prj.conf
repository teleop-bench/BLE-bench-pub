# nRF52840 dongle — BLE 5 L2CAP CoC central throughput driver

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="nrf-l2cap-central"

# L2CAP CoC client
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_TX_MTU=512

# BLE 5 throughput knobs — as central we drive PHY/DLE/interval
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Generous TX buffering so the controller can pack MANY packets per
# connection event (this is what unlocks >100 KB/s vs BlueZ's ~1-2/event).
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
# EXPERIMENT (2026-07-27): FORCE_MD only ARMS when trx_cnt >= BT_BUF_ACL_TX_COUNT-1
# (lll_conn.c:80 FORCE_MD_CNT_SET). At 24 that needs 23 pkts/event; we send ~2, so
# FORCE_MD never armed and had zero effect. Drop to 3 so it arms at trx_cnt>=2 and
# holds the event open for the app to refill. Trade-off: fewer TX buffers overall.
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CONN_TX_MAX=24

# Force the "More Data" (MD) bit so the controller KEEPS the connection event
# open for the next queued SDU instead of closing it after ~2 packets. This is
# the real lever behind the 62 KB/s wall: in a combined host+controller build
# (no BT_HCI_RAW) FORCE_MD defaults OFF, so the sender hangs up the event early
# even though 24 TX buffers are queued. AUTO extends based on runtime tx rate;
# if AUTO plateaus, set AUTO=n and use FORCE_MD_COUNT=3 for a deterministic hold.
# The FORCE_MD knobs below live in the controller's "Advanced features" menu,
# which is `visible if BT_CTLR_ADVANCED_FEATURES` and OFF by default — so any
# assignment to them is SILENTLY dropped (falls back to default, no warning)
# unless this gate is enabled first. THIS is why "no Kconfig lever" looked true.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y

# FORCE_MD_COUNT: deterministically set the MD ("More Data") bit N times after
# each non-empty TX so the connection event stays open for the next SDU instead
# of closing after ~2 packets. Direct, reproducible knob. This broke the 62 KB/s
# wall (-> ~117).
# Sweep (2026-07-27, FORCE_MD_COUNT x BT_BUF_ACL_TX_COUNT): COUNT 3/6/10 all give
# ~114-117 — holding the event open longer doesn't help when the app has no more
# data queued, i.e. we're sender-refill-limited, not close-early-limited. ACL_TX
# above 3 de-arms FORCE_MD (arms at trx_cnt>=ACL_TX-1; we send ~3.7/event): =4 was
# choppy (CV6%), =5 collapsed (~80/CV33%). COUNT=10 measured marginally best
# (117.1/CV2.4%) with no downside, so adopted. Past ~117 needs feed/credit tuning
# (README §8 #3) + a sniffer (#2) to confirm the refill limit — not more config.
CONFIG_BT_CTLR_FORCE_MD_COUNT=10

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_LOG=y
