; nRF52840 Dongle (PCA10059) — BLE 5 L2CAP CoC *central* throughput driver.
;
; Connects to the nRF52832 DK peripheral (zenoh-nrf-l2cap), forces LE 2M PHY +
; DLE + a short 7.5 ms connection interval (as central it controls these),
; opens an L2CAP CoC channel on PSM 0x80, puts the peer in SINK mode and blasts
; SDUs. The DK peripheral measures + prints the throughput over its J-Link console.
;
; Board JSON (boards/nrf52840dongle.json) maps to Zephyr 2.7's built-in
; nrf52840dongle_nrf52840 board, so this builds with the same PlatformIO
; toolchain as the peripheral — no nRF Connect SDK needed.
;
; Build:  pio run
; Flash:  DFU — put dongle in bootloader (press reset), then nRF Connect
;         Programmer → add .pio/build/nrf52840dongle/firmware.hex → Write.

[env:nrf52840dongle]
platform = nordicnrf52
board = nrf52840dongle
framework = zephyr
