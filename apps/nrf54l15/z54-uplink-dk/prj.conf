# nRF52832 DK — BLE 5 L2CAP CoC UPLINK BLASTER (peripheral -> central).
# Re-tests Zephyr #46073 (peripheral TX-context wedge) on 4.4.1's rewritten TX path.

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="zenoh-nrf-l2cap"

# Pin 7.5 ms so the peripheral doesn't throttle itself
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_TX_MTU=512

# BLE 5 throughput knobs (peripheral is the SENDER here)
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# nRF54L15: DROP the nRF52 FORCE_MD hack + tight 3-deep ACL-TX pool (that combo
# wedges the nRF54's TX pipeline). Let the newer controller manage packets/event.
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_CONN_TX_MAX=24

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y

# spare conn slot so adv can restart before the old conn is fully reaped
CONFIG_BT_MAX_CONN=2
