# GATT-SDC responder FSU fragment — apply ON THE FSU-ON ARM ONLY, stacked after the SDC sink overlays,
# e.g.  -DEXTRA_CONF_FILE="sdc-sel.conf;tput.conf;sdc-6x.conf;sdc-llbuf.conf;sdc-fsu.conf"
#
# WHY: FSU (lowest frame space) must be enabled on BOTH ends. The GATT-SDC *central* FSU-on overlay
# (hh-sdc-fsu.conf) sets CONFIG_BT_CTLR_SDC_ENABLE_LOWEST_FRAME_SPACE=y, and the CoC-SDC sink
# (apps/coc/coc-sink/sdc.conf) sets it too — but the GATT-SDC responder overlays historically did NOT,
# so the SDC-GATT FSU-on responder stayed at the default frame space and the measured SDC-GATT FSU
# delta was UNDERSTATED. This fragment closes that gap. (SDC Kconfig semantics live in nRF Connect SDK,
# not this repo — re-measure the SDC-GATT FSU delta after adding this; the prior number is conservative.)
CONFIG_BT_CTLR_SDC_ENABLE_LOWEST_FRAME_SPACE=y
