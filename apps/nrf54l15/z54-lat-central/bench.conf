# §14.9 watchdog-bench overlay — NOT part of the default build.
# Enabling the HB sender measurably shifts the ping RTT distribution
# (observed mean ~11.9 -> ~8.9 ms), so latency baselines must be taken
# WITHOUT this fragment. Build with:
#   west build -- -DEXTRA_CONF_FILE=bench.conf
CONFIG_APP_HB_SENDER=y
