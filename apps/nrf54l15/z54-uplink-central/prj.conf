# nRF52840 dongle — BLE 5 L2CAP CoC UPLINK SINK (central receives peripheral's blast).
# Counterpart to z44-uplink-dk for the #46073 re-test.

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="nrf-l2cap-central"

CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_TX_MTU=512
# central is the RECEIVER here -> explicit RX credits via seg_recv
CONFIG_BT_L2CAP_SEG_RECV=y

CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=8
CONFIG_BT_CTLR_RX_BUFFERS=8

# UPLINK LEVER: force the central to keep the connection event open (MD=1 on its
# empty PDUs) so the peripheral gets more than ~1 packet/event to send upstream.
# FORCE_MD arms only when trx_cnt >= BT_BUF_ACL_TX_COUNT-1, so drop the TX pool to 3.
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_FORCE_MD_COUNT=10

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_LOG=y

# central-reboot isolation test: allow sys_reboot()
CONFIG_REBOOT=y
